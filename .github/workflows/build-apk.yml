name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза (например, v1.4). Если указан — публикуется GitHub Release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Приложение сравнивает свой versionName с тегом последнего релиза,
      # поэтому релизный тег обязан совпадать с версией в build.gradle.kts.
      - name: Verify release tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          tag="${tag#v}"
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [ "$tag" != "$version" ]; then
            echo "::error::Тег v$tag не совпадает с versionName $version в app/build.gradle.kts"
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing keystore configured."
          else
            echo "No KEYSTORE_BASE64 secret — building debug APK only."
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK and AAB
        if: env.KEYSTORE_FILE != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: calories
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calorie-counter-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK and AAB
        if: env.KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: calorie-counter-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            target="--target $GITHUB_SHA"
          else
            tag="$GITHUB_REF_NAME"
            target=""
          fi
          files="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            files="app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab $files"
          fi
          gh release create "$tag" $target $files \
            --title "Счётчик калорий $tag" \
            --generate-notes
